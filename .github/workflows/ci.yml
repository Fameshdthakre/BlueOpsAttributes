name: CI

on:
  push:
    branches:
      - main
      - BlueOps2.0
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pytest
        run: |
          pytest tests/

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Node dependencies
        run: npm ci
        
      - name: Build Next.js
        run: npm run build
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          ENCRYPTION_KEY: VGVzdEtleVRoYXRJc0V4YWN0bHk0NENoYXJhY3RlcnM=
