name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Next.js
        env:
          # Minimal placeholders for env vars that might be required during build.
          # Override these in Actions repo secrets for production builds if needed.
          POSTGRES_URL: ${{ secrets.POSTGRES_URL || 'postgres://localhost:5432/blueops_db' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '' }}
        run: npm run build

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          python -m pytest tests/
